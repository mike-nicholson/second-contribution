<!-- design plan
color: --bg:#14171f (ink navy) --surface:#1c212c --panel-line:#33394a --text:#c9536a (burgundy)
        --accent:#c98a3c (brass key) --accent-2:#7a9b6e (sage/unlock) --danger:#a5544a (rust/locked)
type: display "IM Fell English SC" for room names/headings, body "IM Fell English" for narration,
      "JetBrains Mono" for the log/input (terminal feel)
layout: single centered panel, room heading + narration scroll log on top, quick-action chips,
        a fixed input bar at the bottom, inventory shown as a slim sidebar that stacks under on mobile
-->
<title>The Locked House</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #14171f;
    --surface: #1c212c;
    --surface-2: #232a38;
    --line: #33394a;
    --text: #c9536a;
    --text-dim: #9aa0b0;
    --accent: #c98a3c;
    --accent-soft: #c98a3c33;
    --ok: #7a9b6e;
    --danger: #c07064;
    --font-display: "IM Fell English SC", Georgia, serif;
    --font-body: "IM Fell English", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100%;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  header.title {
    text-align: center;
    padding-block: 6px 2px;
  }

  header.title h1 {
    font-family: var(--font-display);
    letter-spacing: 0.04em;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0;
    color: var(--accent);
    text-shadow: 0 0 24px var(--accent-soft);
  }

  header.title p {
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 15px;
    font-style: italic;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 14px;
  }

  @media (max-width: 560px) {
    .board { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .room-head {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--line);
  }

  .room-head .label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .room-head h2 {
    font-family: var(--font-display);
    font-size: 22px;
    margin: 2px 0 0;
    color: var(--text);
    font-weight: 400;
  }

  #log {
    height: 320px;
    overflow-y: auto;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 16px;
    line-height: 1.5;
  }

  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .entry-room { color: var(--text); }
  .entry-you { font-family: var(--font-mono); color: var(--accent); font-size: 14px; }
  .entry-ok { color: var(--ok); }
  .entry-bad { color: var(--danger); }
  .entry-sys { color: var(--text-dim); font-style: italic; }

  .entry-you::before { content: "\203A "; }

  .composer {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
  }

  #cmd {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
  }

  #cmd:focus { border-color: var(--accent); }

  #send {
    background: var(--accent);
    color: #1c1305;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  #send:active { transform: translateY(1px); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 14px 12px;
  }

  .chip {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12.5px;
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
  }

  .chip:hover { border-color: var(--accent); color: var(--text); }

  .side {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .side .label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  #inventory {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .item-pill {
    font-family: var(--font-mono);
    font-size: 12.5px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 4px 9px;
    border-radius: 999px;
  }

  .empty {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .exits {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .exit-pill {
    font-family: var(--font-mono);
    font-size: 12.5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 4px 9px;
    border-radius: 6px;
  }

  #reset {
    align-self: flex-start;
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  #reset:hover { color: var(--text); border-color: var(--accent); }
</style>

<div class="app">
  <header class="title">
    <h1>The Locked House</h1>
    <p>a small text adventure</p>
  </header>

  <div class="board">
    <div class="panel">
      <div class="room-head">
        <div class="label">You are in the</div>
        <h2 id="roomName">Hallway</h2>
      </div>
      <div id="log"></div>
      <div class="chips" id="chips"></div>
      <div class="composer">
        <input id="cmd" type="text" autocomplete="off" placeholder="type a command…" />
        <button id="send">Go</button>
      </div>
    </div>

    <div class="panel side">
      <div>
        <div class="label">Inventory</div>
        <div id="inventory"><span class="empty">nothing</span></div>
      </div>
      <div>
        <div class="label">Exits</div>
        <div class="exits" id="exits"></div>
      </div>
      <button id="reset">↺ Restart</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var rooms = {
    hallway: {
      name: "Hallway",
      description: "A dusty hallway. Doors lead north and east, and the front door stands south.",
      exits: { north: "study", east: "kitchen", south: "porch" },
      items: []
    },
    porch: {
      name: "Porch",
      description: "You step through the front door onto the porch. The street is just beyond the steps!",
      exits: { north: "hallway" },
      items: [],
      isExit: true
    },
    study: {
      name: "Study",
      description: "A study lined with old books. A rusty key sits on the desk.",
      exits: { south: "hallway" },
      items: ["key"]
    },
    kitchen: {
      name: "Kitchen",
      description: "A kitchen with a locked back door.",
      exits: { west: "hallway", east: "garden" },
      items: [],
      lockedExit: "east"
    },
    garden: {
      name: "Garden",
      description: "A garden with a gate leading to freedom!",
      exits: { west: "kitchen" },
      items: [],
      isExit: true
    }
  };

  var state = { room: "hallway", inventory: [], won: false };

  var logEl = document.getElementById("log");
  var roomNameEl = document.getElementById("roomName");
  var invEl = document.getElementById("inventory");
  var exitsEl = document.getElementById("exits");
  var chipsEl = document.getElementById("chips");
  var cmdEl = document.getElementById("cmd");

  function append(text, cls) {
    var p = document.createElement("div");
    p.className = "entry-" + cls;
    p.textContent = text;
    logEl.appendChild(p);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function renderRoom() {
    var room = rooms[state.room];
    roomNameEl.textContent = room.name;

    append(room.description, "room");
    if (room.items.length) {
      append("You see: " + room.items.join(", "), "sys");
    }

    exitsEl.innerHTML = "";
    Object.keys(room.exits).forEach(function (dir) {
      var pill = document.createElement("span");
      pill.className = "exit-pill";
      pill.textContent = dir + (room.lockedExit === dir && state.inventory.indexOf("key") === -1 ? " 🔒" : "");
      exitsEl.appendChild(pill);
    });

    renderInventory();
    renderChips();
  }

  function renderInventory() {
    invEl.innerHTML = "";
    if (!state.inventory.length) {
      invEl.innerHTML = '<span class="empty">nothing</span>';
      return;
    }
    state.inventory.forEach(function (item) {
      var pill = document.createElement("span");
      pill.className = "item-pill";
      pill.textContent = item;
      invEl.appendChild(pill);
    });
  }

  function renderChips() {
    var room = rooms[state.room];
    var chips = ["look", "inventory", "help"];
    Object.keys(room.exits).forEach(function (dir) { chips.push("go " + dir); });
    room.items.forEach(function (item) { chips.push("take " + item); });

    chipsEl.innerHTML = "";
    chips.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = c;
      b.addEventListener("click", function () { runCommand(c); });
      chipsEl.appendChild(b);
    });
  }

  function printHelp() {
    append("Commands: go <direction>, look, take <item>, inventory, help", "sys");
  }

  function runCommand(raw) {
    if (state.won) return;

    var command = raw.trim().toLowerCase();
    if (!command) return;

    append(raw, "you");

    var parts = command.split(/\s+/);
    var action = parts[0];
    var room = rooms[state.room];

    if (action === "help") {
      printHelp();
    } else if (action === "look") {
      append(room.description, "room");
      if (room.items.length) append("You see: " + room.items.join(", "), "sys");
    } else if (action === "inventory") {
      append(state.inventory.length ? "You are carrying: " + state.inventory.join(", ") : "You are carrying: nothing", "sys");
    } else if (action === "go" && parts[1]) {
      var dir = parts[1];
      if (!room.exits[dir]) {
        append("You can't go that way.", "bad");
      } else if (room.lockedExit === dir && state.inventory.indexOf("key") === -1) {
        append("That door is locked. Maybe you need a key.", "bad");
      } else {
        state.room = room.exits[dir];
        var next = rooms[state.room];
        roomNameEl.textContent = next.name;
        append(next.description, "room");
        if (next.items.length) append("You see: " + next.items.join(", "), "sys");
        renderChipsAndExits();
        if (next.isExit) {
          state.won = true;
          append("You escape the house. You win!", "ok");
          cmdEl.disabled = true;
        }
      }
    } else if (action === "take" && parts[1]) {
      var item = parts[1];
      var idx = room.items.indexOf(item);
      if (idx === -1) {
        append("There's no " + item + " here.", "bad");
      } else {
        room.items.splice(idx, 1);
        state.inventory.push(item);
        append("You picked up the " + item + ".", "ok");
        renderChipsAndExits();
      }
    } else {
      append("I don't understand that command.", "bad");
    }

    renderInventory();
  }

  function renderChipsAndExits() {
    var room = rooms[state.room];
    exitsEl.innerHTML = "";
    Object.keys(room.exits).forEach(function (dir) {
      var pill = document.createElement("span");
      pill.className = "exit-pill";
      pill.textContent = dir + (room.lockedExit === dir && state.inventory.indexOf("key") === -1 ? " 🔒" : "");
      exitsEl.appendChild(pill);
    });
    renderChips();
  }

  document.getElementById("send").addEventListener("click", function () {
    runCommand(cmdEl.value);
    cmdEl.value = "";
    cmdEl.focus();
  });

  cmdEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      runCommand(cmdEl.value);
      cmdEl.value = "";
    }
  });

  document.getElementById("reset").addEventListener("click", function () {
    location.reload();
  });

  append("You wake up in an old house with no memory of how you got here.", "sys");
  printHelp();
  renderRoom();
  cmdEl.focus();
})();
</script>
